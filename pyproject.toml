[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drcik-minimal-agent"
version = "0.9.0"
description = "A gap-guided, forecast-utility retrieval agent for contextual time-series forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
huggingface = ["huggingface_hub>=0.25"]
chronos = ["chronos-forecasting>=2.2.0"]
timesfm = ["timesfm[torch]>=2.0.2"]
dev = ["pytest>=8.0"]

[project.scripts]
drcik-agent = "drcik_agent.cli:main"
evolving-agent = "evolving_loop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "drcik_agent*", "evolving_loop*", "numerical_agent*"]

[tool.setuptools.package-data]
evolving_loop = ["knowledge/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
