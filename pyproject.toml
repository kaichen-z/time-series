[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drcik-minimal-agent"
version = "0.3.0"
description = "An iterative evidence-to-impact forecasting agent for Dr-CiK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
huggingface = ["datasets>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
drcik-agent = "drcik_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
